name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  programs:
    runs-on: ubuntu-latest
    env:
      SOLANA_VERSION: v3.1.10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the Solana CLI (cargo build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build the programs
        run: |
          for p in ccip-v2-sender ccip-v2-receiver ccip-v2-ping-pong test-mock-offramp test-mock-router; do
            cargo build-sbf --manifest-path "programs/$p/Cargo.toml" --sbf-out-dir target/deploy
          done
      - name: Test
        run: cargo test --workspace

  scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
      - run: npm run check

  evm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: forge fmt --check
      - run: forge build --deny warnings
      - run: forge test
